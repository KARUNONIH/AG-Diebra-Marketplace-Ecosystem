name: Trello Git Sync

on:
  push:
    branches:
      - main
      - dev

jobs:
  sync-trello:
    runs-on: ubuntu-latest
    steps:
      - name: Notify n8n Webhook
        run: |
          PAYLOAD=$(jq -n \
            --arg project "Marketplace Ecosystem" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg author "${{ github.actor }}" \
            --arg message "${{ github.event.head_commit.message }}" \
            '{project: $project, branch: $branch, commit: $commit, author: $author, message: $message}')

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://n8n.karuno.site/webhook/git-trello-sync
